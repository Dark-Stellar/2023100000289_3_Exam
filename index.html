<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users Feed</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header>
        <h1>Users Feed</h1>
    </header>

    <main>
        <div id="loading">Loading users…</div>
        <div id="users-container" class="users-grid"></div>
    </main>

    <script>
        const API_URL = "https://jsonplaceholder.typicode.com/users";
        const container = document.getElementById("users-container");
        const loading = document.getElementById("loading");

        async function fetchUsers() {
            try {
                loading.style.display = "block";
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("HTTP " + response.status);

                const users = await response.json();
                const firstSix = users.slice(0, 6);
                renderUsers(firstSix);
            } catch (error) {
                console.error("Fetch failed:", error);
                loading.textContent = "Failed to load users.";
            } finally {
                loading.style.display = "none";
            }
        }

        function renderUsers(users) {
            container.innerHTML = "";

            users.forEach((user) => {
                const card = document.createElement("div");
                card.className = "user-card";
                card.dataset.id = user.id;

                card.innerHTML = `
                    <h2>${escapeHtml(user.name)}</h2>
                    <p class="username">@${escapeHtml(user.username)}</p>
                    <p class="email">${escapeHtml(user.email)}</p>
                    <div class="card-actions">
                        <button class="btn btn-remove">Remove User</button>
                    </div>
                `;

                card.querySelector(".btn-remove").addEventListener("click", () => {
                    removeUser(user.id, card);
                });

                container.appendChild(card);
            });
        }

        async function removeUser(userId, card) {
            if (!confirm("Remove this user?")) return;

            try {
                const response = await fetch(`${API_URL}/${userId}`, {
                    method: "DELETE"
                });

                if (response.status !== 200) {
                    throw new Error("Delete failed: " + response.status);
                }

                card.remove();
            } catch (error) {
                console.error("Delete error:", error);
                alert("Could not remove user.");
            }
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        fetchUsers();
    </script>
</body>
</html>
